name: Agent review fix

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-review-fix-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review-fix:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      startsWith(github.event.comment.body, '/agent fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validate trusted agent source
        env:
          AGENT_REPOSITORY: ${{ vars.AGENT_REPOSITORY }}
          AGENT_REF: ${{ vars.AGENT_REF }}
        run: |
          if [ -z "$AGENT_REPOSITORY" ]; then
            echo "::error::Repository variable AGENT_REPOSITORY is required."
            exit 1
          fi
          if [ -z "$AGENT_REF" ]; then
            echo "::error::Repository variable AGENT_REF must pin a trusted tag or commit SHA."
            exit 1
          fi

      - name: Checkout trusted agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.AGENT_REPOSITORY }}
          ref: ${{ vars.AGENT_REF }}
          token: ${{ secrets.AGENT_REPOSITORY_TOKEN || github.token }}
          path: agent
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Setup Bun for the trusted agent
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install trusted agent dependencies
        working-directory: agent
        run: bun install --frozen-lockfile

      - name: Require target agent configuration
        run: test -f "$GITHUB_WORKSPACE/target/agent.config.json"

      - name: Authorize triggering comment
        id: gate
        working-directory: agent
        env:
          AGENT_CONFIG_PATH: ${{ github.workspace }}/target/agent.config.json
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run src/github-action.ts

      - name: Pull isolated Node.js quality image
        env:
          QUALITY_IMAGE: ${{ vars.AGENT_QUALITY_CONTAINER_IMAGE || 'node:24-bookworm-slim' }}
        run: docker pull "$QUALITY_IMAGE"

      - name: Configure commit identity and ephemeral Git authentication
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x "$GITHUB_WORKSPACE/agent/deploy/github-actions/git-askpass.sh"

      - name: Apply requested review fix
        working-directory: agent
        env:
          AGENT_ENGINE: ${{ vars.AGENT_ENGINE || 'codex' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_QUALITY_CONTAINER_IMAGE: ${{ vars.AGENT_QUALITY_CONTAINER_IMAGE || 'node:24-bookworm-slim' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_RUN_MARKER_AUTHOR: github-actions[bot]
          GITHUB_TOKEN: ${{ github.token }}
          GIT_ASKPASS: ${{ github.workspace }}/agent/deploy/github-actions/git-askpass.sh
          GIT_ASKPASS_REQUIRE: force
          GIT_TERMINAL_PROMPT: "0"
          GIT_USERNAME: x-access-token
          TARGET_REPO_PATH: ${{ github.workspace }}/target
        run: >-
          bun run src/cli.ts fix-pr
          "${{ steps.gate.outputs.pull_request_number }}"
          --apply
          --config "${{ github.workspace }}/target/agent.config.json"
          --command-kind "${{ steps.gate.outputs.command_kind }}"
          --command-id "${{ steps.gate.outputs.command_id }}"
